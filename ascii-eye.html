<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Eye</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #out { display: block; width: 100vw; height: 100vh; }
  #ui {
    position: fixed; top: 12px; right: 12px; z-index: 10;
    display: flex; flex-direction: column; gap: 8px;
    padding: 12px; background: rgba(10,10,10,.82); border: 1px solid #333; border-radius: 8px;
    font: 12px Consolas, "Courier New", monospace; color: #ccc;
    transition: opacity .3s;
  }
  #ui.hidden { opacity: 0; pointer-events: none; }
  #ui .row { display: flex; gap: 6px; align-items: center; }
  #ui button {
    font: inherit; color: #ddd; background: #1b1b1b; border: 1px solid #444;
    border-radius: 4px; padding: 5px 9px; cursor: pointer;
  }
  #ui button.on { background: #e0a040; color: #000; border-color: #e0a040; }
  #ui input[type=range] { width: 110px; accent-color: #e0a040; }
  #ui .hint { color: #777; font-size: 11px; }
  #file { display: none; }
</style>
</head>
<body>
<canvas id="out"></canvas>

<script>
// Paul Bourke's 70-level ramp, the same one the original Python script uses
const RAMP = " .'`^\",:;Il!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";

const out = document.getElementById('out');
const octx = out.getContext('2d');
const scene = document.createElement('canvas');     // full scene, half resolution
const sctx = scene.getContext('2d');
const small = document.createElement('canvas');     // one pixel per character cell
const mctx = small.getContext('2d', { willReadFrequently: true });

const state = {
  source: 'eye', video: null, color: true, paused: false,
  fontSize: 10, gamma: 0.85, cols: 0, rows: 0, cw: 0, ch: 0, t: 0,
};

// ---------- procedural eye ----------

function rand(seed) { // deterministic PRNG so the iris looks the same every load
  return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
}

const IRIS = (() => {
  const S = 512, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), R = S / 2, r = rand(7);
  g.translate(R, R);

  let grd = g.createRadialGradient(0, 0, R * 0.1, 0, 0, R);
  grd.addColorStop(0.00, '#f2b450');
  grd.addColorStop(0.30, '#d88a30');
  grd.addColorStop(0.55, '#a65e22');
  grd.addColorStop(0.85, '#5c3012');
  grd.addColorStop(1.00, '#1c0d05');
  g.fillStyle = grd; g.beginPath(); g.arc(0, 0, R, 0, Math.PI * 2); g.fill();

  // radial fibers
  for (let i = 0; i < 900; i++) {
    const bright = r() < 0.6;
    // dark fibers start further out so they don't merge with the pupil
    const a = r() * Math.PI * 2, r0 = R * (bright ? 0.12 + r() * 0.15 : 0.42 + r() * 0.2), r1 = R * (0.55 + r() * 0.43);
    g.strokeStyle = bright ? `rgba(255,${190 + r() * 50 | 0},${90 + r() * 60 | 0},${0.15 + r() * 0.35})`
                           : `rgba(40,18,5,${0.2 + r() * 0.4})`;
    g.lineWidth = 0.6 + r() * 2.2;
    const wob = (r() - 0.5) * 0.15;
    g.beginPath();
    g.moveTo(Math.cos(a) * r0, Math.sin(a) * r0);
    g.quadraticCurveTo(Math.cos(a + wob) * (r0 + r1) / 2, Math.sin(a + wob) * (r0 + r1) / 2,
                       Math.cos(a) * r1, Math.sin(a) * r1);
    g.stroke();
  }
  // crypts
  for (let i = 0; i < 40; i++) {
    const a = r() * Math.PI * 2, d = R * (0.35 + r() * 0.4);
    g.fillStyle = `rgba(30,12,3,${0.3 + r() * 0.4})`;
    g.beginPath(); g.ellipse(Math.cos(a) * d, Math.sin(a) * d, 4 + r() * 10, 2 + r() * 4, a, 0, Math.PI * 2); g.fill();
  }
  // golden inner zone + bright collarette ring
  grd = g.createRadialGradient(0, 0, R * 0.1, 0, 0, R * 0.55);
  grd.addColorStop(0, 'rgba(255,200,90,.55)'); grd.addColorStop(1, 'rgba(255,170,60,0)');
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = grd; g.beginPath(); g.arc(0, 0, R * 0.55, 0, Math.PI * 2); g.fill();
  g.globalCompositeOperation = 'source-over';
  g.strokeStyle = 'rgba(255,215,120,.55)'; g.lineWidth = 10;
  g.beginPath(); g.arc(0, 0, R * 0.38, 0, Math.PI * 2); g.stroke();
  // dark limbal ring
  grd = g.createRadialGradient(0, 0, R * 0.82, 0, 0, R);
  grd.addColorStop(0, 'rgba(0,0,0,0)'); grd.addColorStop(1, 'rgba(0,0,0,.9)');
  g.fillStyle = grd; g.beginPath(); g.arc(0, 0, R, 0, Math.PI * 2); g.fill();
  return c;
})();

const VEINS = (() => {
  const r = rand(42), v = [];
  for (let i = 0; i < 14; i++) {
    const side = r() < 0.5 ? -1 : 1, y = (r() - 0.5) * 0.6;
    const pts = [[side * 1.6, y]];
    for (let k = 1; k <= 4; k++) {
      const p = pts[k - 1];
      pts.push([p[0] - side * (0.12 + r() * 0.12), p[1] + (r() - 0.5) * 0.12]);
    }
    v.push(pts);
  }
  return v;
})();

// Gas-giant band texture, tileable horizontally
const BANDS = (() => {
  const W = 512, H = 256, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'), r = rand(11);
  const pal = ['#f6c870', '#e09040', '#b8602a', '#7a3a18', '#f0a858', '#d27a34', '#fbe0a0', '#8c4620'];
  for (let y = 0; y < H; y += 2) {
    const k = Math.sin(y * 0.09) * 0.5 + Math.sin(y * 0.23 + 1.3) * 0.3 + Math.sin(y * 0.031) * 0.6;
    g.fillStyle = pal[Math.abs(Math.floor(k * 4 + 4)) % pal.length];
    g.fillRect(0, y, W, 2);
  }
  // turbulent streaks + a storm, drawn twice so the texture wraps cleanly
  for (let i = 0; i < 260; i++) {
    const x = r() * W, y = r() * H, w = 20 + r() * 90, h = 1 + r() * 4;
    g.fillStyle = r() < 0.5 ? `rgba(255,230,170,${0.15 + r() * 0.25})` : `rgba(80,30,10,${0.15 + r() * 0.3})`;
    for (const dx of [0, -W]) { g.beginPath(); g.ellipse(x + dx, y, w, h, 0, 0, Math.PI * 2); g.fill(); }
  }
  for (const dx of [0, -W]) {
    g.fillStyle = 'rgba(150,50,20,.85)'; g.beginPath(); g.ellipse(330 + dx, 165, 34, 15, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(255,190,120,.6)'; g.beginPath(); g.ellipse(330 + dx, 165, 20, 7, 0, 0, Math.PI * 2); g.fill();
  }
  return c;
})();

const STARS = (() => {
  const r = rand(99), s = [];
  for (let i = 0; i < 260; i++) {
    const a = r() * Math.PI * 2, d = Math.sqrt(r());
    s.push({ x: Math.cos(a) * d, y: Math.sin(a) * d, size: r(), ph: r() * 6.28, sp: 1 + r() * 3, blue: r() < 0.35 });
  }
  return s;
})();

// Space inside the pupil, in pupil units (pupil radius = 1)
function drawSpace(g, t, vis, px) {
  g.globalAlpha = vis;
  for (const s of STARS) {
    // mostly faint so they turn into . : + rather than solid letters
    const tw = (0.2 + 0.5 * Math.abs(Math.sin(t * s.sp + s.ph))) * (s.size > 0.85 ? 1.4 : 1);
    g.fillStyle = s.blue ? `rgba(170,200,255,${tw})` : `rgba(255,245,225,${tw})`;
    g.beginPath(); g.arc(s.x, s.y, (0.8 + s.size * 1.2) / px, 0, Math.PI * 2); g.fill();
  }

  const R = 0.21, tilt = -0.28;
  g.save();
  g.translate(0.04, 0.05);
  g.rotate(tilt);

  const ring = (front) => {
    g.save();
    g.beginPath();
    if (front) g.rect(-2, 0, 4, 2); else g.rect(-2, -2, 4, 2);
    g.clip();
    for (let i = 0; i < 9; i++) {
      const k = 1.45 + i * 0.07;
      if (i === 5) continue; // Cassini-like gap
      g.strokeStyle = `rgba(255,${180 + i * 8},${90 + i * 10},${0.9 - i * 0.05})`;
      g.lineWidth = R * 0.09;
      g.beginPath(); g.ellipse(0, 0, R * k, R * k * 0.24, 0, 0, Math.PI * 2); g.stroke();
    }
    g.restore();
  };

  ring(false);

  // atmosphere glow
  g.globalCompositeOperation = 'lighter';
  let grd = g.createRadialGradient(0, 0, R * 0.9, 0, 0, R * 1.35);
  grd.addColorStop(0, `rgba(255,150,50,${0.7 * vis})`); grd.addColorStop(1, 'rgba(255,90,20,0)');
  g.fillStyle = grd; g.beginPath(); g.arc(0, 0, R * 1.35, 0, Math.PI * 2); g.fill();
  g.globalCompositeOperation = 'source-over';

  // body with scrolling bands
  g.save();
  g.beginPath(); g.arc(0, 0, R, 0, Math.PI * 2); g.clip();
  const bw = R * 4, off = ((t * 0.05) % 1) * bw;
  g.drawImage(BANDS, -R - off, -R, bw, R * 2);
  g.drawImage(BANDS, -R - off + bw, -R, bw, R * 2);
  // day/night terminator, light from upper-left
  grd = g.createRadialGradient(-R * 0.45, -R * 0.5, R * 0.1, -R * 0.2, -R * 0.2, R * 1.45);
  grd.addColorStop(0, 'rgba(255,240,200,.55)'); grd.addColorStop(0.55, 'rgba(0,0,0,0)'); grd.addColorStop(1, 'rgba(0,0,0,.85)');
  g.fillStyle = grd; g.fillRect(-R, -R, R * 2, R * 2);
  g.restore();
  // bright sunlit limb
  g.globalCompositeOperation = 'lighter';
  g.strokeStyle = `rgba(255,220,140,${0.9 * vis})`; g.lineWidth = R * 0.08;
  g.beginPath(); g.arc(0, 0, R * 0.97, Math.PI * 0.95, Math.PI * 1.75); g.stroke();
  g.globalCompositeOperation = 'source-over';

  ring(true);
  g.restore();
  g.globalAlpha = 1;
}

// Storyboard copied from the reel: close-up → blink → open & look around → zoom into the eye →
// dive through the pupil into space with a planet → pull back out to the eye
// s = zoom, o = lid opening, p = pupil size, sp = how visible the space inside the pupil is
const KEYS = [
  { t: 0,    s: 3.1,  o: 1.00, p: 0.55, gx:  0.00, gy:  0.00, dark: 0.05, sp: 0.35 },
  { t: 2.0,  s: 2.6,  o: 1.00, p: 0.35, gx:  0.00, gy:  0.00, dark: 0.05, sp: 0.10 },
  { t: 2.8,  s: 1.6,  o: 0.00, p: 0.40, gx:  0.00, gy:  0.00, dark: 0.20, sp: 0.00 },
  { t: 4.4,  s: 1.3,  o: 0.03, p: 0.40, gx:  0.00, gy:  0.00, dark: 0.25, sp: 0.00 },
  { t: 6.0,  s: 1.0,  o: 1.00, p: 0.40, gx: -0.35, gy:  0.02, dark: 0.10, sp: 0.00 },
  { t: 7.6,  s: 1.0,  o: 1.00, p: 0.38, gx:  0.38, gy: -0.04, dark: 0.10, sp: 0.00 },
  { t: 9.4,  s: 2.4,  o: 1.00, p: 0.60, gx:  0.00, gy:  0.00, dark: 0.15, sp: 0.30 },
  { t: 10.8, s: 7.4,  o: 1.00, p: 0.80, gx:  0.00, gy:  0.00, dark: 0.05, sp: 1.00 },
  { t: 13.6, s: 8.8,  o: 1.00, p: 0.80, gx:  0.00, gy:  0.00, dark: 0.00, sp: 1.00 },
  { t: 15.4, s: 7.8,  o: 1.00, p: 0.80, gx:  0.00, gy:  0.00, dark: 0.05, sp: 1.00 },
  { t: 17.6, s: 3.4,  o: 1.00, p: 0.75, gx:  0.00, gy:  0.00, dark: 0.10, sp: 0.90 },
  { t: 19.5, s: 3.1,  o: 1.00, p: 0.55, gx:  0.00, gy:  0.00, dark: 0.05, sp: 0.35 },
];
const LOOP = 19.5;

function params(t) {
  t %= LOOP;
  let i = 0;
  while (i < KEYS.length - 2 && t > KEYS[i + 1].t) i++;
  const a = KEYS[i], b = KEYS[i + 1];
  let u = (t - a.t) / (b.t - a.t);
  u = u * u * (3 - 2 * u);
  const p = {};
  for (const k in a) p[k] = a[k] + (b[k] - a[k]) * u;
  // zoom is interpolated geometrically so the dive feels like constant speed
  p.s = a.s * Math.pow(b.s / a.s, u);
  // hippus + micro-saccades keep it alive between keyframes
  p.p += Math.sin(t * 2.3) * 0.02 + Math.sin(t * 5.1) * 0.01;
  p.gx += Math.sin(t * 1.7) * 0.015 + (Math.sin(t * 13) > 0.96 ? 0.02 : 0);
  p.gy += Math.cos(t * 1.3) * 0.01;
  return p;
}

function bez(p0, p1, p2, p3, u) {
  const v = 1 - u;
  return v * v * v * p0 + 3 * v * v * u * p1 + 3 * v * u * u * p2 + u * u * u * p3;
}

function eyePath(g, o) {
  g.beginPath();
  g.moveTo(-1.6, 0);
  g.bezierCurveTo(-0.8, -1.0 * o, 0.8, -1.0 * o, 1.6, 0);
  g.bezierCurveTo(0.8, 0.75 * o, -0.8, 0.75 * o, -1.6, 0);
  g.closePath();
}

function drawEye(g, W, H, t) {
  const P = params(t);
  const o = Math.max(P.o, 0.001);

  // skin
  let grd = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
  grd.addColorStop(0, '#c48a52'); grd.addColorStop(0.6, '#9a6233'); grd.addColorStop(1, '#5a3418');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = grd; g.fillRect(0, 0, W, H);

  const base = Math.min(W, H) / 2.2 * P.s;
  // when zoomed in, the camera tracks the iris
  const track = Math.min(1, Math.max(0, (P.s - 1) / 1.5));
  g.setTransform(base, 0, 0, base, W / 2 - P.gx * track * base, H / 2 - P.gy * track * base);
  g.lineCap = 'round';

  // lid crease and under-eye shadow
  g.strokeStyle = 'rgba(70,35,15,.6)'; g.lineWidth = 0.09;
  g.beginPath(); g.moveTo(-1.8, -0.15); g.bezierCurveTo(-0.9, -1.25, 0.9, -1.25, 1.8, -0.15); g.stroke();
  g.strokeStyle = 'rgba(70,35,15,.35)'; g.lineWidth = 0.06;
  g.beginPath(); g.moveTo(-1.5, 0.35); g.bezierCurveTo(-0.7, 1.05, 0.7, 1.05, 1.5, 0.35); g.stroke();

  // eyeball, clipped to the almond
  g.save();
  eyePath(g, o); g.clip();
  grd = g.createRadialGradient(0, 0, 0.2, 0, 0, 1.7);
  grd.addColorStop(0, '#efe6dc'); grd.addColorStop(0.6, '#c9b4a2'); grd.addColorStop(1, '#6e4a36');
  g.fillStyle = grd; g.fillRect(-2, -2, 4, 4);
  g.strokeStyle = 'rgba(170,40,30,.45)'; g.lineWidth = 0.012;
  for (const v of VEINS) {
    g.beginPath(); g.moveTo(v[0][0], v[0][1]);
    for (let k = 1; k < v.length; k++) g.lineTo(v[k][0], v[k][1]);
    g.stroke();
  }

  const IR = 0.62, ix = P.gx, iy = P.gy;
  g.drawImage(IRIS, ix - IR, iy - IR, IR * 2, IR * 2);
  // pupil
  const pr = IR * P.p * 0.62;
  grd = g.createRadialGradient(ix, iy, pr * 0.7, ix, iy, pr * 1.08);
  grd.addColorStop(0, '#000'); grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd; g.beginPath(); g.arc(ix, iy, pr * 1.08, 0, Math.PI * 2); g.fill();
  // the pupil is a window into space
  if (P.sp > 0.01) {
    g.save();
    g.beginPath(); g.arc(ix, iy, pr, 0, Math.PI * 2); g.clip();
    g.translate(ix, iy); g.scale(pr, pr);
    drawSpace(g, t, Math.min(1, P.sp), base * pr);
    g.restore();
  }
  // catchlight (fades out during the dive, otherwise it would cover the screen)
  g.fillStyle = `rgba(255,255,255,${0.85 * (1 - Math.min(1, P.sp))})`;
  g.beginPath(); g.ellipse(ix + IR * 0.28, iy - IR * 0.3, IR * 0.11, IR * 0.08, -0.5, 0, Math.PI * 2); g.fill();

  // upper-lid shadow over the eyeball
  grd = g.createLinearGradient(0, -0.75 * o, 0, -0.75 * o + 0.45);
  grd.addColorStop(0, 'rgba(30,12,4,.75)'); grd.addColorStop(1, 'rgba(30,12,4,0)');
  g.fillStyle = grd; g.fillRect(-2, -2, 4, 4);
  g.restore();

  // lid edges
  g.strokeStyle = '#3a1a0a'; g.lineWidth = 0.05;
  eyePath(g, o); g.stroke();

  // lashes along the upper lid; they flip downward as the eye closes
  g.strokeStyle = '#140804';
  const r = rand(3);
  for (let i = 0; i < 46; i++) {
    const u = 0.06 + (i / 45) * 0.88 + (r() - 0.5) * 0.01;
    const x = bez(-1.6, -0.8, 0.8, 1.6, u), y = bez(0, -1.0 * o, -1.0 * o, 0, u);
    const len = 0.22 + Math.sin(u * Math.PI) * 0.22 + r() * 0.06;
    const dir = (u - 0.5) * 1.6;
    const up = -1 + 2 * (1 - Math.min(1, P.o * 1.6));
    g.lineWidth = 0.018 + r() * 0.012;
    g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + dir * len * 0.4, y + up * len * 0.6, x + dir * len, y + up * len * 0.75 - 0.05);
    g.stroke();
  }

  g.setTransform(1, 0, 0, 1, 0, 0);
  if (P.dark > 0) { g.fillStyle = `rgba(0,0,0,${P.dark})`; g.fillRect(0, 0, W, H); }
}

// ---------- ASCII renderer ----------

function resize() {
  const dpr = window.devicePixelRatio || 1;
  out.width = innerWidth * dpr; out.height = innerHeight * dpr;
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  octx.font = `${state.fontSize}px Consolas, "Courier New", monospace`;
  octx.textBaseline = 'top';
  state.cw = octx.measureText('M').width;
  state.ch = state.fontSize * 1.18;
  state.cols = Math.ceil(innerWidth / state.cw);
  state.rows = Math.ceil(innerHeight / state.ch);
  small.width = state.cols; small.height = state.rows;
  scene.width = Math.ceil(innerWidth / 2); scene.height = Math.ceil(innerHeight / 2);
}

function drawSource() {
  const W = scene.width, H = scene.height;
  if (state.source === 'eye' || !state.video || state.video.readyState < 2) {
    drawEye(sctx, W, H, state.t);
    return;
  }
  const v = state.video, vw = v.videoWidth, vh = v.videoHeight;
  const k = Math.max(W / vw, H / vh), dw = vw * k, dh = vh * k;
  sctx.setTransform(1, 0, 0, 1, 0, 0);
  sctx.fillStyle = '#000'; sctx.fillRect(0, 0, W, H);
  if (state.source === 'cam') { sctx.translate(W, 0); sctx.scale(-1, 1); }
  sctx.drawImage(v, (W - dw) / 2, (H - dh) / 2, dw, dh);
  sctx.setTransform(1, 0, 0, 1, 0, 0);
}

function render() {
  const { cols, rows, cw, ch, gamma, color } = state;
  drawSource();
  mctx.drawImage(scene, 0, 0, cols, rows);
  const px = mctx.getImageData(0, 0, cols, rows).data;

  octx.fillStyle = '#000';
  octx.fillRect(0, 0, innerWidth, innerHeight);
  const n = RAMP.length - 1;
  let last = '';
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const i = (y * cols + x) * 4;
      const r = px[i], g = px[i + 1], b = px[i + 2];
      const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      // a little noise so flat areas shimmer like the original
      const l = Math.pow(lum, gamma) + (Math.random() - 0.5) * 0.04;
      const ci = Math.max(0, Math.min(n, Math.round(l * n)));
      if (ci === 0) continue;
      let fs;
      if (color) {
        const k = 1.25 + (1 - lum) * 0.9;
        fs = `rgb(${Math.min(255, r * k + 12) | 0},${Math.min(255, g * k + 8) | 0},${Math.min(255, b * k + 4) | 0})`;
      } else {
        const v = Math.min(255, 40 + lum * 260) | 0;
        fs = `rgb(${v},${v},${v})`;
      }
      if (fs !== last) { octx.fillStyle = fs; last = fs; }
      octx.fillText(RAMP[ci], x * cw, y * ch);
    }
  }
}

let prev = performance.now();
function loop(now) {
  const dt = Math.min(0.1, (now - prev) / 1000); prev = now;
  if (!state.paused) state.t += dt;
  render();
  requestAnimationFrame(loop);
}

// ---------- sources & UI ----------

const $ = id => document.getElementById(id);
const srcButtons = { eye: $('srcEye'), cam: $('srcCam'), file: $('srcFile') };

function setSource(name) {
  if (state.video && state.source === 'cam' && state.video.srcObject) {
    state.video.srcObject.getTracks().forEach(tr => tr.stop());
  }
  state.source = name;
  for (const k in srcButtons) srcButtons[k].classList.toggle('on', k === name);
}

function makeVideo() {
  const v = document.createElement('video');
  v.muted = true; v.loop = true; v.playsInline = true;
  return v;
}

srcButtons.eye.onclick = () => setSource('eye');
srcButtons.cam.onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
    setSource('cam');
    state.video = makeVideo(); state.video.srcObject = stream; state.video.play();
  } catch (e) { alert('Не удалось открыть камеру: ' + e.message); }
};
srcButtons.file.onclick = () => $('file').click();

function playFile(file) {
  if (!file || !file.type.startsWith('video')) return;
  setSource('file');
  state.video = makeVideo(); state.video.src = URL.createObjectURL(file); state.video.play();
}
$('file').onchange = e => playFile(e.target.files[0]);
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); playFile(e.dataTransfer.files[0]); });

$('size').oninput = e => { state.fontSize = +e.target.value; $('sizeVal').textContent = e.target.value; resize(); };
$('gamma').oninput = e => { state.gamma = e.target.value / 100; };
$('color').onclick = e => { state.color = !state.color; e.target.classList.toggle('on', state.color); };
$('pause').onclick = e => {
  state.paused = !state.paused; e.target.classList.toggle('on', state.paused);
  if (state.video) state.paused ? state.video.pause() : state.video.play();
};
addEventListener('keydown', e => {
  if (e.key === 'h' || e.key === 'H' || e.key === 'р' || e.key === 'Р') $('ui').classList.toggle('hidden');
  if (e.key === ' ') $('pause').click();
});

addEventListener('resize', resize);
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
